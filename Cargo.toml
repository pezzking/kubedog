[package]
name = "kubedog"
version = "0.9.0"
edition = "2021"
description = "Kubedog - a desktop Kubernetes client"
readme = "README.md"
license = "Apache-2.0"
repository = "https://github.com/pezzking/kubedog"

[dependencies]
# persistence: the window's size and place are kept between runs.
eframe = { version = "0.37", features = ["persistence"] }
# The symbol fonts that come with egui: without them symbols are taken from the system, and not every system has them.
egui = { version = "0.37", features = ["monochrome_emoji_fonts"] }
egui_extras = "0.37"
image = { version = "0.25", default-features = false, features = ["png"] }
serde_json = "1"
portable-pty = "0.9"
vt100 = "0.15"
# Reading from Grafana (rustls, so the same on every system; no proxies, no redirects).
ureq = { version = "3.5", default-features = false, features = ["rustls", "platform-verifier"] }
# Network Lab looks at a TLS connection step by step (both already used by ureq).
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rustls-platform-verifier = "0.7"
# SHA-256 of a certificate (already used by rustls).
ring = "0.17"
# Keys for AI services are kept in the system's own keychain.
keyring = { version = "3", default-features = false, features = ["apple-native", "windows-native", "linux-native"] }

[target.'cfg(target_os = "macos")'.dependencies]
winit = "0.30"
# The standard macOS menu bar (Kubedog, Edit, View, Go, Window, Help).
muda = { version = "0.17", default-features = false }

# Windows: the icon inside kubedog.exe (see build.rs).
[build-dependencies]
winresource = { version = "0.1", default-features = false }

[dev-dependencies]
# Tests talk to a small HTTPS server with a throwaway certificate.
rcgen = { version = "0.14", default-features = false, features = ["crypto", "pem", "ring"] }

# Debug builds: optimise the libraries (egui's drawing code) so the window stays smooth.
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[profile.release]
opt-level = 2
